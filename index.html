(()=>{'use strict';const $=id=>document.getElementById(id);const N=20,MAX_CHUNKS=9;let scene,camera,renderer,ray,clock,started=false,paused=false;let yaw=0,pitch=-.15,velocityY=0,onGround=false;const player={x:0,y:9,z:0,hp:100,food:100};const inventory={dirt:12,wood:0,stone:0,leaf:0,coal:0,iron:0,berry:3,plank:0,stick:0,pick:0,sword:0,meal:0};const labels={grass:'草地',dirt:'泥土',stone:'石頭',wood:'木頭',leaf:'樹葉',coal:'煤礦',iron:'鐵礦',sand:'沙子',snow:'雪',plank:'木板',stick:'木棍',pick:'石鎬',sword:'石劍',berry:'莓果',meal:'食物'};const blockTypes=['dirt','stone','wood','plank','grass','sand','leaf'];let selected='dirt',tool='hand';const chunks=new Map(),changes=new Map(),entities=[];let lastSave=0,dayTime=0;const key=(x,y,z)=>`${x},${y},${z}`,ck=(cx,cz)=>`${cx},${cz}`;const rand=(x,z)=>{let n=Math.sin(x*127.1+z*311.7)*43758.5453;return n-Math.floor(n)};const h=(x,z)=>Math.floor(4+2.5*Math.sin(x*.078)+2*Math.cos(z*.093)+1.7*Math.sin((x+z)*.051));const matColors={grass:0x5e9a4b,dirt:0x8a6140,stone:0x858d8c,wood:0x8b633f,leaf:0x3d7743,coal:0x3d4446,iron:0xa88e76,sand:0xd8c28b,snow:0xe1e9e8,plank:0xb8905e};let materials={},cube;
function texture(color,name){const c=document.createElement('canvas');c.width=c.height=64;const ctx=c.getContext('2d');const base='#'+color.toString(16).padStart(6,'0');ctx.fillStyle=base;ctx.fillRect(0,0,64,64);const soil=name==='dirt'||name==='grass';const stone=name==='stone'||name==='coal'||name==='iron';const sand=name==='sand';const wood=name==='wood'||name==='plank';const leaf=name==='leaf';const count=soil?1600:sand?1350:stone?1250:900;for(let i=0;i<count;i++){const x=Math.floor(rand(i*17+color,i*31+7)*64),y=Math.floor(rand(i*37+11,i*13+color)*64),v=rand(i*29+3,i*43+color);const size=soil?(v>.94?3:1):stone?(v>.91?3:1):1;let palette=soil?['#4d3221','#67432a','#986c46','#b68b5b','#c2ad85','#565a50']:sand?['#b9a074','#d8c18f','#f0dbaa','#a58c69','#77756b']:stone?['#5c6260','#6f7673','#a5a9a5','#b5b7b0','#555b5a']:wood?['#61462d','#a27a4d','#d3a46b','#6f5133']:leaf?['#285d30','#438045','#6a9b4c','#a2b66c']:['#4c453d','#aaa095','#d2d0bf'];ctx.globalAlpha=.3+v*.55;ctx.fillStyle=palette[Math.floor(v*palette.length)];ctx.fillRect(x,y,size,size)}ctx.globalAlpha=1;if(soil){for(let i=0;i<65;i++){const x=Math.floor(rand(i*67+3,11)*63),y=Math.floor(rand(i*7+1,19)*63),v=rand(i*13,29);ctx.fillStyle=v>.5?'#85837b':'#b9aa91';ctx.fillRect(x,y,v>.7?3:2,v>.7?2:1)}for(let i=0;i<18;i++){let x=Math.floor(rand(i*23,33)*64),y=Math.floor(rand(i*29,35)*64);ctx.strokeStyle=i%2?'#5d412b':'#765037';ctx.globalAlpha=.45;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+3,y+2);ctx.lineTo(x+5,y+2);ctx.stroke()}ctx.globalAlpha=1}if(stone){for(let i=0;i<25;i++){const x=Math.floor(rand(i*37,45)*61),y=Math.floor(rand(i*39,49)*61);ctx.fillStyle=i%2?'#b4b4ad':'#5d6461';ctx.fillRect(x,y,3,2)}}if(wood){for(let i=0;i<15;i++){let x=Math.floor(rand(i*51,21)*64);ctx.fillStyle=i%2?'#5c402a':'#c09a64';ctx.globalAlpha=.45;ctx.fillRect(x,0,1,64)}ctx.globalAlpha=1}const t=new THREE.CanvasTexture(c);t.magFilter=THREE.NearestFilter;t.minFilter=THREE.NearestMipmapNearestFilter;t.colorSpace=THREE.SRGB function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc5dc);scene.fog=new THREE.Fog(0x9bc5dc,35,85);camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.08,110);renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.insertBefore(renderer.domElement,document.body.firstChild);scene.add(new THREE.HemisphereLight(0xddeeff,0x68794f,2.0));const sun=new THREE.DirectionalLight(0xffefd1,2.1);sun.position.set(40,70,30);scene.add(sun);cube=new THREE.BoxGeometry(1,1,1);for(const [name,color] of Object.entries(matColors))materials[name]=new THREE.MeshLambertMaterial({map:texture(color,name)});ray=new THREE.Raycaster();clock=new THREE.Clock();const old=localStorage.getItem('narebek_v10');if(old){try{const s=JSON.parse(old);Object.assign(inventory,s.inventory||{});Object.assign(player,s.player||{});for(const [k,v] of s.changes||[])changes.set(k,v)}catch(e){}}if(!old){player.x=0;player.z=0;player.y=h(0,0)+2}refreshChunks();refreshBar();addEntities();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});requestAnimationFrame(loop)}
function generated(x,y,z){const ht=h(x,z);if(y<=ht){if(y===ht)return ht>8?'snow':ht<3?'sand':'grass';if(y>ht-3)return 'dirt';const ore=rand(x*7+y*13,z*11-y*3);return y<2&&ore>.96?'iron':ore>.945?'coal':'stone'}if(y>ht&&y<=ht+4&&rand(x*2,z*3)>.985&&rand(x,z)>.80){const tx=x-(x%4),tz=z-(z%4);if(rand(tx,tz)>.76&&Math.abs(x-tx)<=1&&Math.abs(z-tz)<=1){if(y<=h(tx,tz)+3)return 'wood';if(y<=h(tx,tz)+5)return 'leaf'}}return null}
function block(x,y,z){const k=key(x,y,z);return changes.has(k)?changes.get(k):generated(x,y,z)}
function buildChunk(cx,cz){const group=new THREE.Group();const lists={};for(let x=cx*N;x<(cx+1)*N;x++)for(let z=cz*N;z<(cz+1)*N;z++){const ht=h(x,z);for(let y=Math.max(0,ht-4);y<=ht+6;y++){const t=block(x,y,z);if(!t)continue;if(block(x+1,y,z)&&block(x-1,y,z)&&block(x,y+1,z)&&block(x,y-1,z)&&block(x,y,z+1)&&block(x,y,z-1))continue;(lists[t]??=[]).push([x,y,z])}}for(const [t,positions] of Object.entries(lists)){if(!materials[t])continue;const m=new THREE.InstancedMesh(cube,materials[t],positions.length);const obj=new THREE.Object3D();positions.forEach(([x,y,z],i)=>{obj.position.set(x,y,z);obj.updateMatrix();m.setMatrixAt(i,obj.matrix)});m.userData.positions=positions;m.userData.type=t;m.instanceMatrix.needsUpdate=true;group.add(m)}scene.add(group);chunks.set(ck(cx,cz),group)}
function refreshChunks(){const cx=Math.floor(player.x/N),cz=Math.floor(player.z/N);for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++){const k=ck(cx+dx,cz+dz);if(!chunks.has(k))buildChunk(cx+dx,cz+dz)}for(const [k,g] of chunks){const [x,z]=k.split(',').map(Number);if(Math.abs(x-cx)>1||Math.abs(z-cz)>1){scene.remove(g);chunks.delete(k)}}}

function getTarget(){ray.setFromCamera(new THREE.Vector2(0,0),camera);ray.far=6;const hits=ray.intersectObjects([...chunks.values()],true);for(const hit of hits){if(hit.instanceId===undefined||!hit.object.userData.positions)continue;const p=hit.object.userData.positions[hit.instanceId];if(p)return {p,normal:hit.face.normal.clone()}}return null}

function mine(){if(paused)return;const t=getTarget();if(!t)return;const [x,y,z]=t.p;if(y<0)return;const type=block(x,y,z);changes.set(key(x,y,z),null);const drop=type==='grass'?'dirt':type==='snow'?'stone':type==='sand'?'dirt':type;inventory[drop]=(inventory[drop]||0)+1;rebuild(x,z);refreshBar();notify('採集 '+(labels[drop]||drop))}

const recipes=[['木板',{wood:1},{plank:4}],['木棍',{plank:2},{stick:4}],['石鎬',{stone:3,stick:2},{pick:1}],['石劍',{stone:2,stick:1},{sword:1}],['莓果餐',{berry:3},{meal:1}],['木板建材',{wood:2},{plank:8}],['簡易石材',{dirt:4,stone:2},{stone:4}]];function showCraft(){paused=true;$('panel').style.display='flex';renderCraft()}function renderCraft(){$('inventory').textContent=Object.entries(inventory).filter(([,v])=>v>0).map(([k,v])=>`${labels[k]||k} ×${v}`).join('　')||'背包是空的';$('recipes').innerHTML='';for(const [name,needs,out] of recipes){const b=document.createElement('button');b.textContent=`${name}：${Object.entries(needs).map(([k,v])=>`${labels[k]}×${v}`).join(' + ')}`;b.onclick=()=>{if(Object.entries(needs).some(([k,v])=>(inventory[k]||0)<v)){notify('材料不足');return}for(const [k,v] of Object.entries(needs))inventory[k]-=v;for(const [k,v] of Object.entries(out))inventory[k]=(inventory[k]||0)+v;if(out.pick)tool='pick';if(out.sword)tool='sword';renderCraft();refreshBar();notify('合成 '+name)};$('recipes').appendChild(b)}const eat=document.createElement('button');eat.textContent='食用莓果（恢復飢餓值）';eat.onclick=()=>{if(inventory.berry>0){inventory.berry--;player.food=Math.min(100,player.food+13);renderCraft()}};$('recipes').appendChild(eat);const meal=document.createElement('button');meal.textContent='食用莓果餐（恢復更多飢餓值）';meal.onclick=()=>{if(inventory.meal>0){inventory.meal--;player.food=Math.min(100,player.food+42);renderCraft()}};$('recipes').appendChild(meal)}
function animal(x,z,type){const group=new THREE.Group();const bodyMat=new THREE.MeshLambertMaterial({color:type==='rabbit'?0xcac4af:0xa67b58});const add=(w,h,d,px,py,pz,mat=bodyMat)=>{const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);mesh.position.set(px,py,pz);group.add(mesh)};add(1,.8,1.3,0,.75,0);add(.65,.65,.65,0,1.2,-.75);for(const sx of [-.32,.32])for(const sz of [-.4,.4])add(.23,.65,.23,sx,.13,sz);if(type==='rabbit')for(const sx of [-.2,.2])add(.17,.6,.17,sx,1.75,-.8);else for(const sx of [-.25,.25])add(.2,.55,.2,sx,1.65,-.85);group.position.set(x,h(Math.round(x),Math.round(z))+.5,z);scene.add(group);entities.push({group,x,z,type,enemy:false,phase:rand(x,z)*6})}
function golem(x,z){const group=new THREE.Group(),rock=new THREE.MeshLambertMaterial({color:0x707878}),eye=new THREE.MeshBasicMaterial({color:0x72d9df});const add=(w,hh,d,px,py,pz,m=rock)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,hh,d),m);o.position.set(px,py,pz);group.add(o)};add(1.2,1.5,.7,0,1.6,0);add(.85,.85,.85,0,2.7,0);for(const s of [-1,1]){add(.5,1.3,.5,s*.95,1.65,0);add(.5,1,.5,s*.36,.45,0);add(.15,.13,.08,s*.22,2.75,-.45,eye)}group.position.set(x,h(Math.round(x),Math.round(z))+.5,z);scene.add(group);entities.push({group,x,z,type:'golem',enemy:true,hp:3,phase:0})}
function addEntities(){for(let i=0;i<12;i++){const x=Math.floor((rand(i,2)-.5)*55),z=Math.floor((rand(i,8)-.5)*55);if(i%4===0)golem(x,z);else animal(x,z,i%2?'rabbit':'deer')}}
function attack(){if(paused)return;let hit=null,best=4;for(const e of entities){if(!e.enemy)continue;const dist=Math.hypot(e.x-player.x,e.z-player.z);if(dist<best){best=dist;hit=e}}if(hit){hit.hp-=tool==='sword'?2:1;notify('擊中岩石守衛');if(hit.hp<=0){scene.remove(hit.group);entities.splice(entities.indexOf(hit),1);inventory.stone+=3;refreshBar();notify('獲得石頭 ×3')}}else notify('附近沒有可攻擊的怪物')}
const keys={};let joyX=0,joyY=0,drag=null;function setup(){const pad=$('pad'),nub=$('nub');let joyPointer=null;function endJoy(e){if(e&&joyPointer!==e.pointerId)return;joyPointer=null;joyX=joyY=0;nub.style.transform='translate(0px,0px)'}function moveJoy(e){if(e.pointerId!==joyPointer)return;const r=pad.getBoundingClientRect();let x=(e.clientX-r.left-r.width/2)/45,y=(e.clientY-r.top-r.height/2)/45;const magnitude=Math.hypot(x,y);if(magnitude>1){x/=magnitude;y/=magnitude}if(magnitude<.13){x=0;y=0}joyX=x;joyY=y;nub.style.transform=`translate(${joyX*38}px,${joyY*38}px)`}pad.addEventListener('pointerdown',e=>{if(joyPointer!==null)return;e.preventDefault();joyPointer=e.pointerId;pad.setPointerCapture(e.pointerId);moveJoy(e)});pad.addEventListener('pointermove',e=>{if(joyPointer===e.pointerId){e.preventDefault();moveJoy(e)}});pad.addEventListener('pointerup',endJoy);pad.addEventListener('pointercancel',endJoy);pad.addEventListener('lostpointercapture',endJoy);window.addEventListener('blur',()=>endJoy());document.addEventListener('visibilitychange',()=>{if(document.hidden)endJoy()});renderer.domElement.addEventListener('pointerdown',e=>{drag={id:e.pointerId,x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;yaw-=(e.clientX-drag.x)*.005;pitch=Math.max(-1.3,Math.min(1.3,pitch-(e.clientY-drag.y)*.005));drag.x=e.clientX;drag.y=e.clientY});renderer.domElement.addEventListener('pointerup',()=>drag=null);addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')jump();if(e.key==='e')showCraft()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);$('mine').onclick=mine;$('place').onclick=place;$('jump').onclick=jump;$('attack').onclick=attack;$('craft').onclick=showCraft;$('close').onclick=()=>{paused=false;$('panel').style.display='none'};$('save').onclick=()=>{save();notify('已儲存')};$('reset').onclick=()=>{if(confirm('確定刪除 Nare function jump(){if(onGround){velocityY=7.2;onGround=false}}function save(){try{localStorage.setItem('narebek_v10',JSON.stringify({inventory,player,changes:[...changes]}))}catch(e){notify('儲存空間不足')}}function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.04);if(!started||paused)return;dayTime+=dt;const forward=(keys.w?1:0)-(keys.s?1:0)-joyY;const side=(keys.d?1:0)-(keys.a?1:0)+joyX;const len=Math.max(1,Math.hypot(forward,side)),speed=5.3;player.x+=(-Math.sin(yaw)*forward+Math.cos(yaw)*side)/len*speed*dt;player.z+=(-Math.cos(yaw)*forward-Math.sin(yaw)*side)/len*speed*dt;velocityY-=19*dt;player.y+=velocityY*dt;const floor=h(Math.round(player.x),Math.round(player.z))+2.05;if(player.y<floor){player.y=floor;velocityY=0;onGround=true}camera.position.set(player.x,player.y,player.z);camera.rotation.order='YXZ';camera.rotation.y=yaw;camera.rotation.x=pitch;refreshChunks();for(const e of entities){const d=Math.hypot(e.x-player.x,e.z-player.z);if(e.enemy&&d<13&&d>1.5){e.x+=(player.x-e.x)/d*dt*.65;e.z+=(player.z-e.z)/d*dt*.65}else if(!e.enemy){e.x+=Math.sin(dayTime*.4+e.phase)*dt*.13;e.z+=Math.cos(dayTime*.3+e.phase)*dt*.13}e.group.position.set(e.x,h(Math.round(e.x),Math.round(e.z))+.5,e.z);if(e.enemy&&d<1.65&&Math.floor(dayTime*2)!==Math.floor((dayTime-dt)*2))player.hp=Math.max(0,player.hp-5)}if(Math.floor(dayTime)%7===0&&Math.floor(dayTime)!==Math.floor(dayTime-dt))player.food=Math.max(0,player.food-1);if(player.food===0&&Math.floor(dayTime)%4===0&&Math.floor(dayTime)!==Math.floor(dayTime-dt))player.hp=Math.max(0,player.hp-2);if(player.hp===0){player.hp=100;player.food=65;player.x=0;player.z=0;player.y=h(0,0)+3;notify('重新出發！')}const t=(Math.sin(dayTime*.035)+1)/2;scene.background.setHSL(.57,.36,.22+t*.48);scene.fog.color.copy(scene.background);$('hp').textContent=`❤️ ${player.hp}`;$('food').textContent=`🍗 ${player.food}`;$('day').textContent=t>.28?'☀️ 白天':'🌙 夜晚';$('coords').textContent=`${Math.round(player.x)}, ${Math.round(player.z)}`;renderer.render(s
